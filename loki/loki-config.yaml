
# This is a complete configuration to deploy Loki backed by the filesystem.
# The index will be shipped to the storage via tsdb-shipper.

auth_enabled: false

limits_config:
  # Structured metadata was designed 
  # to support native ingestion of OpenTelemetry data.
  allow_structured_metadata: true
  volume_enabled: true
  otlp_config:
    # Map OpenTelemetry Resource Attributes to Loki Labels
    # https://grafana.com/docs/loki/latest/send-data/otel/#changing-the-default-mapping-of-otlp-to-loki-format
    # Label best practices
    # https://grafana.com/docs/loki/next/get-started/labels/bp-labels/
    resource_attributes:
      attributes_config:
        - action: index_label
          regex: deployment.environment.name

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 0.0.0.0
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
  - from: 2020-05-15
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: index_
      period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /tmp/loki/index
    cache_location: /tmp/loki/index_cache
  filesystem:
    directory: /tmp/loki/chunks

pattern_ingester:
  enabled: true
