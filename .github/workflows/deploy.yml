name: Manual Deploy to Develop ECS

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  TF_STATE_BUCKET: redis-pubsub-101
  TF_STATE_KEY: develop/redis-pubsub-101.tfstate


jobs:
  deploy:
    name: Deploy to Develop ECS
    runs-on: ubuntu-latest
    environment: develop

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download Image Tag from Build Workflow
      uses: dawidd6/action-download-artifact@v4
      with:
        workflow: build.yml
        name: image-tag
        path: .
        branch: main
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Read Image Tag
      id: image_tag
      run: echo "tag=$(cat image_tag.txt)" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::838835070561:role/github_actions_redis_pubpub_101
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.9.8 # Or your desired version

    - name: Terraform Init
      run: |
        terraform -chdir=infra/environments/develop init \
          -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ env.TF_STATE_KEY }}" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Apply
      env:
        IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
      run: |
        terraform -chdir=infra/environments/develop apply -auto-approve \
          -var="webapp_image_tag=$IMAGE_TAG" \
          -var="controller_image_tag=$IMAGE_TAG" \
          -var="scheduler_image_tag=$IMAGE_TAG"
